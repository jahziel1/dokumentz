[package]
name = "dokumentz-metrics"
description = "Instrumentación de Dokumentz (FR-012): Recorder, Span, Histogram y esquema de resultados"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Solo `serde` y `serde_json`: ninguna dependencia de red (T013 lo comprueba con `cargo tree`).
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3.27.0"
